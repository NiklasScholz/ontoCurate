services:
  backend:
    build:
      context: ./backend
      target: prod
    volumes:
      - oxigraph_data:/data/oxigraph
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://onto:onto@postgres:5432/onto
      - REDIS_URL=redis://redis:6379
      - OXIGRAPH_URL=http://oxigraph:7878
      - OXIGRAPH_DATA_PATH=/data/oxigraph
    env_file:
      - backend/secrets.env
    depends_on:
      - postgres
      - redis
      - oxigraph
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: prod
    volumes:
      - oxigraph_data:/data/oxigraph
    environment:
      - DATABASE_URL=postgresql+asyncpg://onto:onto@postgres:5432/onto
      - REDIS_URL=redis://redis:6379
      - OXIGRAPH_URL=http://oxigraph:7878
      - OXIGRAPH_DATA_PATH=/data/oxigraph
    env_file:
      - backend/secrets.env
    depends_on:
      - postgres
      - redis
      - oxigraph
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: onto
      POSTGRES_PASSWORD: onto
      POSTGRES_DB: onto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    volumes:
      - oxigraph_data:/data
      - ./infra/oxigraph/config.toml:/config.toml:ro
    command: serve --location /data --bind 0.0.0.0:7878
    restart: unless-stopped

volumes:
  postgres_data:
  oxigraph_data:
