literal_derivation:
  Person:
    - as: orcid
      from_literal: identifier
    - as: doi
      from_relation_in: author
      relation_literal: doi
    - as: affiliation
      from_relation_out: affiliation
      relation_literal: name

wikidata_lookup:
  settings:
    candidate_limit: 5
    language: en
    request_delay_seconds: 0.1

    default_threshold: 0.8
    default_weights:
      syntactic: 0.6
      semantic: 0.3
    default_comparison_predicates:
      - name
    default_semantic_text_predicates:
      - name
    default_expand_initials: false

  entity_types:
    Person:
      require_any_of:
        - givenName
      instance_of:
        - Q5  # human

      search_queries:
        - predicates:
            - givenName
            - familyName
          require_all: true
          join_with: " "

        - predicates:
            - name
      candidate_literals:
        name:
          - source: label
          - source: aliases
        givenName:
          - source: item_claim_labels
            property: P735

        familyName:
          - source: item_claim_labels
            property: P734

        orcid:
          - source: string_claims
            property: P496

        affiliation:
          - source: item_claim_labels
            property: P108  # employer
          - source: item_claim_labels
            property: P1416  # affiliation
      scoring:
        threshold: 0.95
        weights:
          syntactic: 1.0
          semantic: 0.0
        comparison_predicates:
          - name
        semantic_text_predicates:
          - name
        sparsity_penalty: 1.0
        sparsity_max_fields: 1
        hard_match_predicates:
          name: 0.98
        fuzzy_match_penalty: 0.1
        unresolved_orcid_penalty: 0.4

    Organization:
      instance_of:
        - Q43229  # organization
        - Q3918  # university
        - Q2085381  # publishing house

      search_queries:
        - predicates:
            - name

      candidate_literals:
        name:
          - source: label
          - source: aliases

      scoring:
        threshold: 0.90
        weights:
          syntactic: 0.85
          semantic: 0.15
        comparison_predicates:
          - name
        semantic_text_predicates:
          - name

    Conference:
      instance_of:
        - Q2020153  # academic conference

      search_queries:
        - predicates:
            - name

      candidate_literals:
        name:
          - source: label
          - source: aliases

      scoring:
        threshold: 0.82
        weights:
          syntactic: 0.15
          semantic: 0.85
        comparison_predicates:
          - name
        semantic_text_predicates:
          - name
        expand_initials: true

    Workshop:
      instance_of:
        - Q40444998  # academic workshop

      search_queries:
        - predicates:
            - name

      candidate_literals:
        name:
          - source: label
          - source: aliases

      scoring:
        threshold: 0.85
        weights:
          syntactic: 0.5
          semantic: 0.5
        comparison_predicates:
          - name
        semantic_text_predicates:
          - name

orcid_lookup:
  settings:
    candidate_limit: 5
    request_delay_seconds: 0.1
    field_names:
      givenName: given-names
      familyName: family-name
      name: text
      doi: digital-object-ids
      affiliation: current-institution-affiliation-name

  entity_types:
    Person:
      require_any_of:
        - doi
        - affiliation

      search_queries:
        - predicates:
            - familyName
            - doi
          require_all: true

        - predicates:
            - familyName
            - affiliation
          require_all: true
        - predicates:
            - givenName
            - familyName
          require_all: true
          join_with: " "

      scoring:
        threshold: 0.9
        weights:
          syntactic: 1.0
          semantic: 0.0
        comparison_predicates:
          - name
        semantic_text_predicates:
          - name
        sparsity_penalty: 1.0
        sparsity_max_fields: 1
        hard_match_predicates:
          orcid: 1.0
        fuzzy_match_penalty: 0.05
        unresolved_orcid_penalty: 0.4
