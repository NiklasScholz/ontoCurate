wikidata_lookup:
  settings:
    candidate_limit: 5
    language: en
    request_delay_seconds: 0.1 

  entity_types:
    AcademicArticle:
      search_queries:
        - predicates:
            - title
          max_queries: 2

      candidate_literals:
        title:
          - source: label
          - source: aliases

    Person:
      search_queries:
        - predicates:
            - givenName
            - familyName
          require_all: true
          join_with: " "
          fallback_predicates:
            - familyName
          max_queries: 1

        - predicates:
            - name
          max_queries: 2
      candidate_literals:
        name:
          - source: label
          - source: aliases
        givenName:
        - source: item_claim_labels
          property: P735

        familyName:
          - source: item_claim_labels
            property: P734

        orcid:
          - source: string_claims
            property: P496
      scoring:
        threshold: 0.98
        weights:
          syntactic: 1.0
          semantic: 0.0
          structural: 0.0
        comparison_predicates:
          - name
        semantic_text_predicates:
          - name
        expand_initials: false
        sparsity_penalty: 1.0
        sparsity_max_fields: 1
        hard_match_predicates:
          name: 0.98

    Organization:
      search_queries:
        - predicates:
            - name
          max_queries: 2

      candidate_literals:
        name:
          - source: label
          - source: aliases