# Predicate-aware search windows for provenance span extraction.

predicate_windows:


  title_paper:
    - strategy: head
      chars: 400
    - strategy: section
      heading: "References"
    - strategy: section
      heading: "Bibliography"

  abstract:
    strategy: section
    heading: "Abstract"

  keywords:
    strategy: section
    heading: "Keywords"

  publication_date:
    strategy: full

  doi:
    strategy: full

  url:
    strategy: full

  # Author Field — authors appear near the top; cited authors appear in the
  # References / Bibliography section. Both are valid in-window locations.
  name:
    - strategy: head
      chars: 1000
    - strategy: section
      heading: "References"
    - strategy: section
      heading: "Bibliography"

  given_name:
    - strategy: head
      chars: 1000
    - strategy: section
      heading: "References"
    - strategy: section
      heading: "Bibliography"

  family_name:
    - strategy: head
      chars: 1000
    - strategy: section
      heading: "References"
    - strategy: section
      heading: "Bibliography"

  email:
    strategy: head
    chars: 1500

  org_name:
    - strategy: head
      chars: 1200
    - strategy: section
      heading: "References"
    - strategy: section
      heading: "Bibliography"

  conf_name:
    strategy: full

  workshop_name:
    strategy: full

  series_name:
    strategy: full

  title:
    strategy: full

  issn:
    strategy: full

  eissn:
    strategy: full

  volume:
    strategy: full

  issue_number:
    strategy: full

  publication_year:
    strategy: full

settings:
  # Confidence penalty applied when the match falls outside the declared window
  out_of_window_penalty: 0.8

  # scales relative distance to closest window as penalty
  win_distance_penalty: 1.0
  min_penalty_factor: 0.3

  # Penalty to spatial outliers (i.e. those far from the median positions of all entity triples)
  outlier_penalty: 1.0
  min_outlier_factor: 0.2
  outlier_pentalty_entities:
    - Person
    - Organization
    - AcademicArticle
