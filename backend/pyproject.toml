[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "onto-curate-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "httpx",
    "pyoxigraph",
    "celery[redis]",
    "redis",
    "python-multipart",
    "pydantic-settings",
    "ontogpt",
    "rapidfuzz",
    "dateparser",
    "rdflib",
    "pyyaml",
    "scikit-learn",
    "pymupdf4llm",
    "pronto>=2.7.3",
    "google-auth",
    "PyJWT",
    "pwdlib[bcrypt]",
    "argon2-cffi",
    "pydantic[email]",
    "slowapi"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pydantic_settings",
    "python-multipart",
    "python-dotenv",
    "pyoxigraph",
    "coverage",
    "types-dateparser",
]

[tool.isort]
known_first_party = ["config", "api", "app"]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["app"]

[tool.coverage.run]
# SQLAlchemy manages its async operations via greenlet
# needed so test coverage is aware of greenlet switches and will not report coverage for code that runs on the other
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = [
    "app/routes/debug.py",
    "app/tasks/test.py",
    "app/core/limiter.py",
]
