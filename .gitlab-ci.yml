stages:
  - lint
  - test


backend-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet autoflake==2.2.1 isort==5.13.2 black==26.5.1
  script:
    - autoflake --check --remove-all-unused-imports -r backend/app/
    - isort --check backend/app/
    - black --check backend/app/

backend-test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16
    - redis:7-alpine
    - name: ghcr.io/oxigraph/oxigraph:latest
      alias: oxigraph
      command: ["serve", "--bind", "0.0.0.0:7878"]
  variables:
    POSTGRES_USER: onto
    POSTGRES_PASSWORD: onto
    POSTGRES_DB: onto
    DATABASE_URL: postgresql+asyncpg://onto:onto@postgres:5432/onto
    REDIS_URL: redis://redis:6379
    OXIGRAPH_URL: http://oxigraph:7878
  before_script:
    - cd backend
    - pip install --quiet -e ".[dev]"
  script:
    - coverage run --branch -m pytest tests/ -v
    - coverage report
    - coverage html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - backend/htmlcov/
    expire_in: 1 day


frontend-lint:
  stage: lint
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci --quiet
  script:
    - npm run lint

frontend-test:
  stage: test
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci --quiet
  script:
    - npm test
